name: Deploy Hostinger

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      SSH_PORT: "65002"

    steps:
      - name: Verify successful CI for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$DEPLOY_SHA" != "$main_sha" ]]; then
            echo "::error::This commit is no longer the main branch head. Deploy the latest successful CI instead."
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != success ]]; then
            echo "::error::The latest push CI for this commit must succeed before deployment."
            exit 1
          fi

      - name: Validate Hostinger SSH configuration
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USERNAME SSH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. The Hostinger SSH deploy reuses FTP_SERVER, FTP_USERNAME and FTP_PASSWORD."
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, redis
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install production dependencies
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare release archive
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy/release

          rsync -a ./ .deploy/release/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agent/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.codex-git/' \
            --exclude='.npm-cache/' \
            --exclude='.deploy/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='database/*.sqlite' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            --exclude='bootstrap/cache/*'

          # Hostinger serves the domain directly from public_html, so mirror
          # Laravel's public directory into the deployment root.
          cp -a public/. .deploy/release/
          rm -f .deploy/release/hot

          sed -i "s#__DIR__.'/../vendor/autoload.php'#__DIR__.'/vendor/autoload.php'#" .deploy/release/index.php
          sed -i "s#__DIR__.'/../bootstrap/app.php'#__DIR__.'/bootstrap/app.php'#" .deploy/release/index.php
          sed -i "s#__DIR__.'/../storage/framework/maintenance.php'#__DIR__.'/storage/framework/maintenance.php'#" .deploy/release/index.php

          tar -C .deploy/release -czf .deploy/rechi-os-release.tar.gz .

      - name: Configure SSH client
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release by SCP
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          scp_target="/home/$SSH_USERNAME/rechi-os-release.tar.gz"
          sshpass -e scp -P "$SSH_PORT" .deploy/rechi-os-release.tar.gz "$SSH_USERNAME@$SSH_HOST:$scp_target"

      - name: Activate release over SSH
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          deploy_path="/home/$SSH_USERNAME/domains/rechi.net.br/public_html"
          archive_path="/home/$SSH_USERNAME/rechi-os-release.tar.gz"

          sshpass -e ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_PATH='$deploy_path' ARCHIVE_PATH='$archive_path' bash -s" <<'REMOTE'
          set -euo pipefail

          if [[ ! -f "$ARCHIVE_PATH" ]]; then
            echo "Release archive not found: $ARCHIVE_PATH" >&2
            exit 1
          fi

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          restore_app() {
            if [[ -f artisan ]]; then
              php artisan up >/dev/null 2>&1 || true
            fi
          }
          trap restore_app EXIT

          if [[ -f artisan ]]; then
            php artisan down --retry=60 || true
          fi

          tar -xzf "$ARCHIVE_PATH" -C "$DEPLOY_PATH"
          rm -f "$ARCHIVE_PATH"

          mkdir -p \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          chmod -R ug+rwX storage bootstrap/cache || true

          php artisan migrate --force
          php artisan optimize
          php artisan storage:link || true

          php artisan up
          trap - EXIT
          REMOTE
